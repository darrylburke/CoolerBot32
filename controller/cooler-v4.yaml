# v4 single-relay walk-in cooler controller (ESP32-WROOM-32U, 38-pin DevKit, USB-C).
# Rules: ../RULES-v4.md. Design: ../docs/superpowers/specs/2026-09-26-single-relay-controller-design.md
#
# This file is wiring and I/O only. Every control decision lives in
# cooler_logic.h, which is unit-tested on the host (tests/).

substitutions:
  device_name: esp32-cooler
  ovr_on_c: "5.0"
  ovr_off_c: "3.0"

esphome:
  name: ${device_name}
  includes:
    - cooler_logic.h
    - cooler_esphome.h
  platformio_options:
    build_flags:
      - "-DCOOLER_OVR_ON_C=${ovr_on_c}f"
      - "-DCOOLER_OVR_OFF_C=${ovr_off_c}f"
  on_boot:
    priority: -100
    then:
      - switch.turn_off: relay
      - lambda: 'cooler_glue::load();'

esp32:
  board: esp32dev
  framework:
    # esp-idf: ESPHome only supports mqtt certificate_authority (TLS with the
    # private CA on the broker) on esp-idf.
    type: esp-idf

globals:
  # Settings, FinCal and the logic state are NOT globals: see cooler_esphome.h.

  # ---- history (same semantics as v3 RULES.md), persisted ----
  - { id: temp_hist,    type: 'int[20]', restore_value: yes }
  - { id: hum_hist,     type: 'int[20]', restore_value: yes }
  - { id: hist_n,       type: int,      restore_value: yes, initial_value: '0' }
  - { id: hist_last_ts, type: uint32_t, restore_value: yes, initial_value: '0' }
  - { id: sample_ctr,   type: int,      restore_value: no,  initial_value: '0' }

  # ---- runtime ----
  - { id: g_dirty,   type: int,                restore_value: no, initial_value: '1' }
  # millis() of the SHT30's last delivered reading. sht3xd keeps the old value
  # when the sensor dies, so the logic needs the reading's AGE (review fix).
  - { id: g_sht_ms,  type: uint32_t,           restore_value: no, initial_value: '0' }

wifi:
  # The cooler's network first, then the bench network; ESPHome joins
  # whichever is in range.
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_dev
      password: !secret wifi_password_dev
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

time:
  - platform: sntp
    id: sntp_time

logger:
  level: INFO
  logs:
    mqtt.client: ERROR

ota:
  platform: esphome
  password: !secret ota_password

mqtt:
  id: mqtt_client
  # The broker, over TLS, verified against the private CA below.
  broker: !secret mqtt_broker
  port: 8883
  certificate_authority: |-
    -----BEGIN CERTIFICATE-----
    MIIFGTCCAwGgAwIBAgIUVKdZQk7kxXrT6CBzYLbAMNSsYCUwDQYJKoZIhvcNAQEL
