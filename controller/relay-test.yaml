# Bench test for the relays, the override switch and the status LED on the v4
# controller board.
#
#   AC UNPLUGGED (or CN3 disconnected) before running this: it switches the
#   relays every few seconds.
#
#   cd controller && esphome run relay-test.yaml
#
# What it does:
#   - Holds both relays OFF for the first 10 s after boot, so you can confirm
#     neither one clicks during power-up or reset.
#   - Then cycles: relay 1 on 3 s, off 2 s, relay 2 on 3 s, off 2 s, repeat.
#   - The status LED (GPIO32) lights while the override switch (GPIO21) is
#     closed, and goes out when it opens. Each switch change is logged.
#   - Logs every change on the serial console, e.g. "RELAY 1 (IN1, GPIO16) ON".
#   - Serves a web page at http://cooler-relay-test.local/ (or the IP shown in
#     the log) with switches: turn "Auto cycle" off, then toggle each relay by hand.
#
# Uses its own device name so it never collides with the real controller on
# MQTT or in Home Assistant. Flash cooler-v4.yaml again when you're done.

substitutions:
  device_name: cooler-relay-test

esphome:
  name: ${device_name}
  on_boot:
    priority: -100
    then:
      - switch.turn_off: relay1
      - switch.turn_off: relay2
      - logger.log: { format: "Relay test: both relays OFF; auto cycle starts in 10 s", level: INFO }

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG     # shows the WiFi scan list while we sort out the network

wifi:
  # The cooler's network first, then the bench network; ESPHome joins
  # whichever is in range.
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_dev
      password: !secret wifi_password_dev
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  port: 80

globals:
  - { id: step_s, type: int, restore_value: no, initial_value: '0' }

switch:
  # Same pins and polarity as cooler-v4.yaml: low-level trigger, so ON = pin LOW.
  - platform: gpio
    id: relay1
    name: "Relay 1 (IN1, GPIO16)"
    pin: { number: GPIO16, inverted: true }
    restore_mode: ALWAYS_OFF
    on_turn_on:  { then: [ logger.log: { format: "RELAY 1 (IN1, GPIO16) ON  - expect a click; COM-NO closed", level: INFO } ] }
    on_turn_off: { then: [ logger.log: { format: "RELAY 1 (IN1, GPIO16) OFF - COM-NO open", level: INFO } ] }
  - platform: gpio
    id: relay2
    name: "Relay 2 (IN2, GPIO19)"
    pin: { number: GPIO19, inverted: true }
    restore_mode: ALWAYS_OFF
    on_turn_on:  { then: [ logger.log: { format: "RELAY 2 (IN2, GPIO19) ON  - expect a click; COM-NO closed", level: INFO } ] }
    on_turn_off: { then: [ logger.log: { format: "RELAY 2 (IN2, GPIO19) OFF - COM-NO open", level: INFO } ] }
  - platform: template
    id: auto_cycle
    name: "Auto cycle"
    optimistic: true
    restore_mode: ALWAYS_ON
    on_turn_off:
      - switch.turn_off: relay1
      - switch.turn_off: relay2
      - logger.log: { format: "Auto cycle OFF: use the relay switches on the web page", level: INFO }

output:
  - platform: gpio
    id: status_led
    pin: GPIO32

binary_sensor:
  # Latching override switch to GND, same pin and polarity as cooler-v4.yaml.
  - platform: gpio
    id: override_sw
    name: "Override switch (GPIO21)"
    pin:
      number: GPIO21
      inverted: true
      mode: { input: true, pullup: true }
    filters:
      - delayed_on_off: 50ms
    # Fire on_state for the reading taken at boot too, not only on later
    # changes -- otherwise a switch left closed through a power cycle is missed.
    publish_initial_state: true
    # on_state (not on_press) so the LED is also right if the switch is
    # already closed when the board boots.
    on_state:
      - lambda: |-
          if (x) { id(status_led).turn_on();  ESP_LOGI("test", "SWITCH (GPIO21) CLOSED - LED (GPIO32) ON"); }
          else   { id(status_led).turn_off(); ESP_LOGI("test", "SWITCH (GPIO21) OPEN - LED (GPIO32) OFF"); }

interval:
  - interval: 1s
    then:
      - lambda: |-
          // The LED follows the override switch (see binary_sensor above).
          if (millis() < 10000 || !id(auto_cycle).state) return;
          // 10 s cycle: r1 on 0-2, off 3-4, r2 on 5-7, off 8-9
          int t = id(step_s) % 10;
          id(step_s) = id(step_s) + 1;
          bool r1 = t < 3, r2 = t >= 5 && t < 8;
          if (r1 != id(relay1).state) { if (r1) id(relay1).turn_on(); else id(relay1).turn_off(); }
          if (r2 != id(relay2).state) { if (r2) id(relay2).turn_on(); else id(relay2).turn_off(); }
