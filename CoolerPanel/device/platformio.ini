; Waveshare ESP32-S3-Touch-LCD-4B ("Smart 86 Box"): ESP32-S3-WROOM-1-N16R8,
; 480x480 ST7701 RGB panel (3-wire SPI init via TCA9554 expander @0x20),
; GT911 touch on I2C (SDA=47 SCL=48), AXP2101 PMU, PCF85063 RTC.
; Platform/lib versions mirror Waveshare's demo package (Arduino core 3.2.0,
; Arduino_GFX 1.6.0, SensorLib 0.3.1, LVGL 9.3.0).
[env:esp32s3-86box]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi     ; enable octal PSRAM
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    '-DLV_CONF_PATH="${PROJECT_DIR}/lv_conf.h"'
    -std=gnu++17
; Our include paths apply to our sources only: with custom_sdkconfig the
; framework itself is compiled with build_flags, and ESP-IDF's esp-mqtt would
; pick up shared/platform.h in place of its own platform.h.
build_src_flags =
    -I${PROJECT_DIR}/../shared
    -I${PROJECT_DIR}/../shared/model
    -I${PROJECT_DIR}/../shared/ui
    -I${PROJECT_DIR}/../config
extra_scripts = pre:extra_script_compat.py
build_src_filter =
    +<*>
    +<../../shared/>
    +<../../config/>
    -<../../config/tests/>
lib_deps =
    lvgl/lvgl@9.3.0
    moononournation/GFX Library for Arduino@1.6.0
    lewisxhe/SensorLib@0.3.1
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.3
; The RGB panel's vsync interrupt runs while flash is busy (Wi-Fi start-up
; reads/writes NVS and PHY calibration, settings saves). The stock Arduino
; 3.2.0 libs make that ISR IRAM-safe but leave GDMA_CTRL_FUNC_IN_IRAM off, so
; the gdma_append / gdma_hal_* calls it makes stay in flash, and a refresh
; during a flash operation panics "Cache disabled but cached memory region
; accessed". custom_sdkconfig rebuilds the framework with it on.
; The first build after a change here recompiles the framework (slow).
;
; The rebuild starts from the lib-builder's generic esp32s3 base, without the
; memory-specific overlay the stock qio_opi libs get. Everything below except
; GDMA_CTRL_FUNC_IN_IRAM restores that overlay (octal PSRAM with boot init,
; dynamic Wi-Fi TX buffers, BA window, TCP OOSEQ) or a stock value newer
; components change, and was checked line by line against the stock
; esp32s3/qio_opi sdkconfig.h. Old ESP32_* names are pinned too: the base
; carries them after the new names, so they would otherwise win.
;
; Build quirks (pioarduino 54.03.20):
;  - Delete sdkconfig.esp32s3-86box after editing custom_sdkconfig: an existing
;    project sdkconfig wins over the defaults these lines are written into.
;  - The first build after a change can stop at "assert ARDUINO_FRAMEWORK_DIR"
;    while it reinstalls the framework; run it again.
;  - The build copies ~/.platformio/platforms/espressif32/builder/build_lib by
;    that fixed name; with this platform installed from a URL that folder lives
;    under espressif32@src-*, so copy it across once if the build says so.
custom_sdkconfig =
    CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_GDMA_ISR_IRAM_SAFE=y
    CONFIG_SPIRAM_MODE_QUAD=n
    CONFIG_SPIRAM_MODE_OCT=y
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
    CONFIG_SPIRAM_MEMTEST=n
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER=n
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER=y
    CONFIG_ESP_WIFI_TX_BUFFER_TYPE=1
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=32
    CONFIG_ESP_WIFI_RX_BA_WIN=6
    CONFIG_ESP32_WIFI_STATIC_TX_BUFFER=n
    CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER=y
    CONFIG_ESP32_WIFI_TX_BUFFER_TYPE=1
    CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=32
    CONFIG_ESP32_WIFI_RX_BA_WIN=6
    CONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS=4
    CONFIG_MDNS_ENABLE_BROWSE=n
    CONFIG_LIBSODIUM_USE_MBEDTLS_SHA=n
; Unused cloud components; esp_insights also fails to build in hybrid mode
; (its embedded https_server.crt is never generated).
custom_component_remove =
    espressif/esp_insights
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
