; Waveshare ESP32-S3-Touch-LCD-4B ("Smart 86 Box"): ESP32-S3-WROOM-1-N16R8,
; 480x480 ST7701 RGB panel (3-wire SPI init via TCA9554 expander @0x20),
; GT911 touch on I2C (SDA=47 SCL=48), AXP2101 PMU, PCF85063 RTC.
; Platform/lib versions mirror Waveshare's demo package (Arduino core 3.2.0,
; Arduino_GFX 1.6.0, SensorLib 0.3.1, LVGL 9.3.0).
[env:esp32s3-86box]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi     ; enable octal PSRAM
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    '-DLV_CONF_PATH="${PROJECT_DIR}/lv_conf.h"'
    -I${PROJECT_DIR}/../shared
    -I${PROJECT_DIR}/../shared/model
    -I${PROJECT_DIR}/../shared/ui
    -I${PROJECT_DIR}/../config
    -std=gnu++17
extra_scripts = pre:extra_script_compat.py
build_src_filter =
    +<*>
    +<../../shared/>
    +<../../config/>
    -<../../config/tests/>
lib_deps =
    lvgl/lvgl@9.3.0
    moononournation/GFX Library for Arduino@1.6.0
    lewisxhe/SensorLib@0.3.1
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.3
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
