# Dehumidifier relay controller on the v1 board (ESP32 DevKitC V4, WROOM-32).
# Rules: ../RULES-dehum.md. Design: ../docs/superpowers/specs/2026-10-28-dehumidifier-controller-design.md
#
# This file is wiring and I/O only. Every control decision lives in
# dehum_logic.h, which is unit-tested on the host (tests/).

substitutions:
  device_name: esp32-dehum

esphome:
  name: ${device_name}
  includes:
    - dehum_logic.h
    - dehum_esphome.h
  on_boot:
    priority: -100
    then:
      - switch.turn_off: relay
      - switch.turn_off: relay_spare
      - lambda: 'dehum_glue::load();'

esp32:
  board: esp32dev
  framework:
    # esp-idf: ESPHome only supports mqtt certificate_authority on esp-idf.
    type: esp-idf

globals:
  - { id: g_dirty, type: int, restore_value: no, initial_value: '1' }
  # millis() of the HDC1080's last reading: the sensor keeps the old value when
  # the chip stops answering, so the logic needs the reading's age.
  - { id: g_rh_ms, type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: g_rh_seen, type: bool, restore_value: no, initial_value: 'false' }

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_dev
      password: !secret wifi_password_dev
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

time:
  - platform: sntp
    id: sntp_time

logger:
  level: INFO
  logs:
    mqtt.client: ERROR

ota:
  platform: esphome
  password: !secret ota_password

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 8883
  certificate_authority: |-
    -----BEGIN CERTIFICATE-----
    MIIFGTCCAwGgAwIBAgIUVKdZQk7kxXrT6CBzYLbAMNSsYCUwDQYJKoZIhvcNAQEL
