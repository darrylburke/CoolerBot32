  skip_cert_cn_check: false
  username: !secret dehum_mqtt_username
  password: !secret dehum_mqtt_password
  keepalive: 15s
  # Never reboot on a lost broker: mode, TIMER and CYCLE must survive an outage.
  reboot_timeout: 0s
  client_id: ${device_name}
  # The broker ACL grants this login dehum/# only. No Home Assistant discovery.
  topic_prefix: "dehum"
  discovery: false
  birth_message:
    topic: dehum/availability
    payload: online
    retain: true
  will_message:
    topic: dehum/availability
    payload: offline
    retain: true
  on_connect:
    - lambda: 'id(g_dirty) = 1;'
  on_json_message:
    # Mode and settings, from the panel / app. Settings apply before the mode.
    - topic: dehum/cmd
      qos: 0
      then:
        - lambda: |-
            dehum::Cmd c;
            if (x["min_run"].is<int>())   c.min_run   = x["min_run"].as<int>();
            if (x["timer_h"].is<int>())   c.timer_h   = x["timer_h"].as<int>();
            if (x["cycle_on"].is<int>())  c.cycle_on  = x["cycle_on"].as<int>();
            if (x["cycle_off"].is<int>()) c.cycle_off = x["cycle_off"].as<int>();
            if (x["dehum_rh"].is<int>())  c.dehum_rh  = x["dehum_rh"].as<int>();
            if (x["mode"].is<const char *>()) c.mode = dehum::parse_mode(x["mode"].as<const char *>());
            if (dehum::apply_cmd(c, dehum_glue::settings(), dehum_glue::state()))
              dehum_glue::save_settings();
            id(g_dirty) = 1;
        - script.execute: control
    # AUTO want, from the Cooler only (ACL). QoS 0: Mosquitto never queues
    # these for a reconnecting client, so no stale want arrives late.
    - topic: dehum/want
      qos: 0
      then:
        - lambda: |-
            if (x["want"].is<int>()) {
              const int w = x["want"].as<int>();
              if (w == 0 || w == 1) dehum::on_want(dehum_glue::state(), w == 1);
            }
        - script.execute: control

switch:
  # Dehumidifier power: relay COM/NO in the hot wire.
  # Internal: only dehum_logic.h may drive it.
  # Low-level-trigger module: pin LOW = relay closed. Inverted so ON = closed.
  # (Bench-check the polarity before wiring mains.)
  - platform: gpio
    id: relay
    internal: true
    pin: { number: GPIO16, inverted: true }
    restore_mode: ALWAYS_OFF
  # Spare channel, moved off GPIO14 (which pulses at boot). Held off.
  - platform: gpio
    id: relay_spare
    internal: true
    pin: { number: GPIO23, inverted: true }
    restore_mode: ALWAYS_OFF

i2c:
  # The v1 board's humidity sensor on the DevKitC's SDA/SCL. It answers at 0x40
  # (an HDC1080; the htu21d driver gets no answer from it). 10 kHz for the cable.
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 10khz

sensor:
  - platform: hdc1080
    address: 0x40
    update_interval: 10s
    temperature:
      id: rh_temp
      internal: true
      on_value:
        - lambda: 'id(g_rh_ms) = millis(); id(g_rh_seen) = true;'
    humidity:
      id: rh_hum
      internal: true

  - platform: uptime
    id: uptime_s
    internal: true
    update_interval: 30s

script:
  - id: control
    mode: queued
    max_runs: 3
    then:
      - lambda: |-
          dehum::Inputs in;
          in.mqtt_connected = id(mqtt_client).is_connected();
          in.rh = id(rh_hum).state;
          in.rh_age_ms = id(g_rh_seen) ? millis() - id(g_rh_ms) : UINT32_MAX;
          dehum::Outputs o = dehum::step(in, dehum_glue::settings(), dehum_glue::state(), millis());
          dehum_glue::out() = o;
          if (o.relay != id(relay).state) {
            if (o.relay) id(relay).turn_on(); else id(relay).turn_off();
          }
          if (o.settings_changed) dehum_glue::save_settings();
          if (o.publish_now) id(g_dirty) = 1;

  - id: publish_state
    mode: single
    then:
      - lambda: 'id(g_dirty) = 0;'
      - mqtt.publish_json:
          topic: "dehum/data"
          retain: true
          payload: |-
            const dehum::Outputs &o = dehum_glue::out();
            const dehum::Settings &s = dehum_glue::settings();
            root["v"] = 1;
            root["mode"] = dehum::mode_str(o.mode);
            root["relay"] = o.relay ? 1 : 0;
            if (o.want < 0) root["want"] = nullptr; else root["want"] = o.want;
            root["link_lost"] = o.link_lost ? 1 : 0;
            root["hold_s"] = o.hold_s;
            root["remain_s"] = o.remain_s;
            if (o.phase < 0) root["phase"] = nullptr; else root["phase"] = o.phase ? "on" : "off";
            // A stale reading is not a reading: publish null.
            if (o.rh_valid && !std::isnan(id(rh_temp).state)) root["temp"] = id(rh_temp).state; else root["temp"] = nullptr;
            if (o.rh_valid) root["humidity"] = id(rh_hum).state; else root["humidity"] = nullptr;
            root["humid"] = o.humid ? 1 : 0;
            root["dehum_rh"] = s.dehum_rh;
            root["min_run"] = s.min_run;
            root["timer_h"] = s.timer_h;
            root["cycle_on"] = s.cycle_on;
            root["cycle_off"] = s.cycle_off;
            root["run_s"] = o.run_s;
            root["uptime_s"] = std::isnan(id(uptime_s).state) ? (uint32_t)(millis() / 1000)
                                                               : (uint32_t) id(uptime_s).state;

interval:
  - interval: 1s
    then:
      - script.execute: control
      - if:
          condition:
            lambda: 'return id(g_dirty) != 0 && id(mqtt_client).is_connected();'
          then:
            - script.execute: publish_state

  # status every 30 s regardless of change
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return id(mqtt_client).is_connected();'
          then:
            - script.execute: publish_state
